<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garima's Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #ff4b2b;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #ff4b2b;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff416c;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Garima's Quiz Card ✨</h2>
        <p>Guess the correct answer below!</p>
        
        <button class="btn" onclick="checkAnswer(1)">Option A: Coding</button>
        <button class="btn" onclick="checkAnswer(2)">Option B: Art & Drawing</button>
        <button class="btn" onclick="checkAnswer(3)">Option C: Music</button>

        <div id="result"></div>
    </div>

    <script>
        function checkAnswer(option) {
            const resultDiv = document.getElementById('result');
            if(option === 2) {
                resultDiv.style.color = "green";
                resultDiv.innerHTML = "🎉 Correct Answer! Amazing!";
            } else {
                resultDiv.style.color = "red";
                resultDiv.innerHTML = "❌ Try Again!";
            }
        }
    </script>

</body>
</html>
