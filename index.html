<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garima's Ultimate 1-Min Quiz ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .timer {
      background: #ff4757;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .score {
      background: #2ed573;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    h2 {
      color: #2f3542;
      font-size: 20px;
      margin-bottom: 20px;
      min-height: 50px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      background: #70a1ff;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.correct {
      background: #2ed573 !important;
    }

    .btn.wrong {
      background: #ff4757 !important;
    }

    .start-btn {
      background: #3742fa;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(55, 66, 250, 0.4);
    }

    .hidden {
      display: none;
    }

    #result-screen h1 {
      color: #3742fa;
      font-size: 28px;
      margin-bottom: 10px;
    }

    #result-screen p {
      font-size: 18px;
      color: #57606f;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- Start Screen -->
    <div id="start-screen">
      <h1 style="color: #ff4757; margin-bottom: 15px;">1-Minute Quiz Challenge! ⏱️</h1>
      <p style="color: #57606f; margin-bottom: 25px;">60 seconds me maximum questions ke sahi answer dijiye!</p>
      <button class="start-btn" onclick="startQuiz()">Start Game 🚀</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
      <div class="header-bar">
        <div class="timer">⏱️ <span id="time-left">60</span>s</div>
        <div class="score">Score: <span id="score">0</span></div>
      </div>
      <h2 id="question">Question text here</h2>
      <div class="options" id="options-container">
        <!-- Buttons generated dynamically -->
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
      <h1>Time's Up! 🎉</h1>
      <p>Aapka Final Score: <b><span id="final-score">0</span></b></p>
      <button class="start-btn" onclick="startQuiz()">Play Again 🔄</button>
    </div>
  </div>

  <script>
    // Sound Effects
    const correctSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
    const wrongSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
    const finishSound = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');

    const questions = [
      { q: "HTML ka full form kya hai?", options: ["Hyper Text Markup Language", "High Tech Main Language", "Hyperlink Text Mark", "Home Tool Markup"], answer: 0 },
      { q: "Websites ko stylish banane ke liye kya use hota hai?", options: ["Python", "CSS", "C++", "Java"], answer: 1 },
      { q: "World Wide Web (WWW) kisse related hai?", options: ["Internet", "Offline Game", "Software", "Hardware"], answer: 0 },
      { q: "Browser mein interactive actions ke liye kya use hota hai?", options: ["HTML", "CSS", "JavaScript", "SQL"], answer: 2 },
      { q: "GitHub ka use kis kaam ke liye hota hai?", options: ["Photo Editing", "Code Hosting", "Video Editing", "Music Streaming"], answer: 1 }
    ];

    let currentQ = 0;
    let score = 0;
    let timeLeft = 60;
    let timerInterval;

    function startQuiz() {
      score = 0;
      timeLeft = 60;
      currentQ = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('time-left').innerText = timeLeft;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      startTimer();
      showQuestion();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          endQuiz();
        }
      }, 1000);
    }

    function showQuestion() {
      let qData = questions[currentQ % questions.length];
      document.getElementById('question').innerText = qData.q;
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, btn) {
      let qData = questions[currentQ % questions.length];
      const allBtns = document.querySelectorAll('.btn');
      allBtns.forEach(b => b.style.pointerEvents = 'none');

      if (selectedIndex === qData.answer) {
        btn.classList.add('correct');
        correctSound.currentTime = 0;
        correctSound.play();
        score += 10;
        document.getElementById('score').innerText = score;
        confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
      } else {
        btn.classList.add('wrong');
        wrongSound.currentTime = 0;
        wrongSound.play();
        allBtns[qData.answer].classList.add('correct');
      }

      setTimeout(() => {
        currentQ++;
        showQuestion();
      }, 800);
    }

    function endQuiz() {
      clearInterval(timerInterval);
      finishSound.currentTime = 0;
      finishSound.play();
      confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 } });

      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = score;
    }
  </script>
</body>
</html>
